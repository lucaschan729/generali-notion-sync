name: sync
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 上傳到 Notion
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * 3-4 1"
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pdfplumber curl_cffi openpyxl
      - run: python main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload) && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: excel
          path: "*.xlsx"
          if-no-files-found: ignore
